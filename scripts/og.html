<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Q; src: url("../web/public/fonts/b92c8e0e-d7e0-4d10-83e6-c9a630d38066.woff2") format('woff2'); }
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Century Gothic",Q,sans-serif;background:radial-gradient(120% 120% at 85% -10%,#2A8FA0 0%,#14657E 28%,#06303F 62%,#04202B 100%);color:#FBF7F1;position:relative}
.wrap{position:absolute;left:84px;top:86px;right:420px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#E8D3A2}
.dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(160deg,#E8D3A2,#C9A24B)}
h1{margin:28px 0 0;font-weight:400;font-size:78px;line-height:1.02;letter-spacing:-.025em}
h1 span{color:#E8D3A2}
p{margin:30px 0 0;font-size:25px;line-height:1.5;color:#EAF2F4;max-width:640px}
.name{position:absolute;left:84px;bottom:70px;font-size:26px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
.name i{font-style:normal;color:#E8D3A2}
.mono{position:absolute;right:110px;top:150px;width:260px;height:260px;border-radius:50%;background:linear-gradient(160deg,#E8D3A2,#C9A24B);display:grid;place-items:center;color:#06303F;font-size:96px;font-weight:700;letter-spacing:.05em;box-shadow:0 40px 80px -30px rgba(201,162,75,.8)}
.ring{position:absolute;right:66px;top:106px;width:346px;height:346px;border-radius:50%;border:1.5px solid rgba(232,211,162,.45)}
.ring:before{content:"";position:absolute;top:34px;right:48px;width:14px;height:14px;border-radius:50%;background:#E8D3A2;box-shadow:0 0 18px #E8D3A2}
.line{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#C9A24B,#2A8FA0 60%,#14657E)}
</style></head><body>
<div class="wrap"><div class="eyebrow"><span class="dot"></span>Senior Enterprise Architect · Paris</div>
<h1>Architecture for the <span>agentic enterprise.</span></h1>
<p>Salesforce and enterprise integration, and AI agents connected to real systems through MCP.</p></div>
<div class="ring"></div><div class="mono">MG</div>
<div class="name">Moinak <i>Ghosh</i></div><div class="line"></div>
</body></html>
